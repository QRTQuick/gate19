[project]
name = "gate19"
version = "0.1.0"
description = "Gate19 - The Next Generation Python Project Manager. Fast, smart, and developer-friendly - like Cargo for Python."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chisom Life Eke", email = "quickredtech@gmail.com" }]
maintainers = [{ name = "Chisom Life Eke", email = "quickredtech@gmail.com" }]
keywords = ["package-manager", "project-manager", "python", "cli", "tooling", "uv", "cargo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
    "Environment :: Console",
]
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "httpx>=0.27.0",
    "packaging>=24.0",
    "platformdirs>=4.2.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "isort>=5.13",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/QRTQuick/gate19"
Repository = "https://github.com/QRTQuick/gate19"
Documentation = "https://github.com/QRTQuick/gate19#readme"
Issues = "https://github.com/QRTQuick/gate19/issues"
Changelog = "https://github.com/QRTQuick/gate19/blob/main/CHANGELOG.md"

[project.scripts]
gate19 = "gate19.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gate19"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]
ignore = []

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["gate19"]

[tool.typer]
pretty_exceptions_enable = false
